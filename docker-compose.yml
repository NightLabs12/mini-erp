name: mini-erp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mini_erp}
      POSTGRES_USER: ${DB_USERNAME:-mini_erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mini_erp_secret}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-mini_erp}
      DB_USERNAME: ${DB_USERNAME:-mini_erp}
      DB_PASSWORD: ${DB_PASSWORD:-mini_erp_secret}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(''127.0.0.1'', 9000) ? 0 : 1);"']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/up || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    command: sh /app/docker-entrypoint.sh
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  pgdata:
  frontend_node_modules:
